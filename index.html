<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ランゲームのランキング一覧" />
    <title>ランキング | Run Game</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="site-header">
        <p class="eyebrow">RUN GAME</p>
        <h1>ランキング</h1>
      </header>

      <section class="ranking-panel" aria-labelledby="ranking-title">
        <div class="panel-header">
          <h2 id="ranking-title">ランキング一覧</h2>
          <p id="page-range" class="page-range" hidden></p>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">
          ランキングを読み込んでいます…
        </p>

        <div id="ranking-content" hidden>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Rank</th>
                  <th scope="col">Name</th>
                  <th scope="col" class="number">Score</th>
                  <th scope="col" class="number">Time</th>
                </tr>
              </thead>
              <tbody id="ranking-body"></tbody>
            </table>
          </div>

          <nav class="pagination" aria-label="ランキングのページ移動">
            <button id="previous-page" type="button">前へ</button>
            <button id="next-page" type="button">次へ</button>
          </nav>
        </div>
      </section>
    </main>

    <script src="js/ranking-api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
